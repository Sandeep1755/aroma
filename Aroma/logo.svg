<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 68" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="25%" stop-color="#E5A93C" />
      <stop offset="50%" stop-color="#C68112" />
      <stop offset="75%" stop-color="#FCE0AD" />
      <stop offset="100%" stop-color="#9E5D02" />
    </linearGradient>

    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A00" />
      <stop offset="50%" stop-color="#E65100" />
      <stop offset="100%" stop-color="#BF360C" />
    </linearGradient>

    <linearGradient id="crestBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#211812" />
      <stop offset="100%" stop-color="#0E0B09" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="luxuryShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left: Luxury Monogram Shield / Crest (48x48) -->
  <g transform="translate(4, 8)" filter="url(#luxuryShadow)">
    <!-- Shield Outer Gold Edge -->
    <path d="M 26 2 L 48 10 L 48 32 C 48 44 26 50 26 50 C 26 50 4 44 4 32 L 4 10 Z" fill="url(#goldMetallic)" />
    
    <!-- Shield Inner Dark Velvet Inset -->
    <path d="M 26 4.5 L 45.5 11.5 L 45.5 31.5 C 45.5 42 26 47.5 26 47.5 C 26 47.5 6.5 42 6.5 31.5 L 6.5 11.5 Z" fill="url(#crestBg)" />

    <!-- Inner Filigree & Monogram 'AA' with Sacred Flame -->
    <!-- Golden Flame -->
    <path d="M 26 10 C 22 17 22 21 26 25 C 30 21 30 17 26 10 Z" fill="url(#goldMetallic)" />
    <circle cx="26" cy="18" r="2" fill="#FFE082" />

    <!-- Stylized Heritage 'AA' Interlock -->
    <path d="M 19 38 L 26 22 L 33 38" fill="none" stroke="url(#goldMetallic)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 21.5 33 L 30.5 33" stroke="url(#goldMetallic)" stroke-width="2" />
    <path d="M 15 38 L 26 15 L 37 38" fill="none" stroke="#FFB300" stroke-width="1" opacity="0.6" />

    <!-- Bottom Mini Crown / Godavari Leaf -->
    <circle cx="26" cy="42" r="1.5" fill="url(#goldMetallic)" />
    <circle cx="22" cy="41" r="1" fill="url(#goldMetallic)" />
    <circle cx="30" cy="41" r="1" fill="url(#goldMetallic)" />
  </g>

  <!-- Right: Premium Horizontal Typography Wordmark (Inline) -->
  <!-- Brand Main Title: ATREYAPURAM -->
  <text x="64" y="31" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="21" font-weight="900" letter-spacing="2.5" fill="#1C1917">
    ATREYAPURAM
  </text>

  <!-- Gold Foil Accent Line -->
  <line x1="64" y1="37" x2="330" y2="37" stroke="url(#goldMetallic)" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="197" cy="37" r="2.5" fill="url(#saffronGrad)" stroke="#FFE082" stroke-width="0.8" />

  <!-- Sub-Wordmark: AROMAS • AUTHENTIC ANDHRA CAFE -->
  <g transform="translate(64, 52)">
    <!-- Red/Saffron AROMAS Pill -->
    <rect x="0" y="-10" width="76" height="15" rx="4" fill="url(#saffronGrad)" />
    <text x="7" y="1" font-family="'Plus Jakarta Sans', 'Outfit', sans-serif" font-size="9" font-weight="900" letter-spacing="1.5" fill="#FFFFFF">
      AROMAS
    </text>

    <!-- Subtitle: CAFES • TRICITY -->
    <text x="84" y="1" font-family="'Outfit', sans-serif" font-size="9" font-weight="800" letter-spacing="2" fill="#B45309">
      CAFES • ANDHRA HERITAGE
    </text>
  </g>
</svg>
